<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Test Request Tool</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --border: #ddd9d0;
    --text: #1a1814;
    --muted: #7a7568;
    --accent: #c0392b;
    --accent-light: #fdf0ee;
    --accent-mid: #e8c5c0;
    --check: #2d7a4f;
    --check-light: #edf7f2;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  header {
    width: 100%;
    max-width: 560px;
    margin-bottom: 40px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid var(--accent-mid);
    padding: 4px 10px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.2;
    color: var(--text);
  }

  h1 span {
    color: var(--muted);
    font-weight: 300;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    overflow: hidden;
  }

  .card-section {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
  }

  .card-section:last-child { border-bottom: none; }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .tests-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .test-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    background: var(--bg);
  }

  .test-item:hover {
    border-color: var(--check);
    background: var(--check-light);
  }

  .test-item.checked {
    border-color: var(--check);
    background: var(--check-light);
  }

  .test-item input[type="checkbox"] {
    appearance: none;
    width: 17px;
    height: 17px;
    border: 2px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    background: white;
  }

  .test-item.checked input[type="checkbox"] {
    background: var(--check);
    border-color: var(--check);
  }

  .test-item.checked input[type="checkbox"]::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 0px;
    width: 5px;
    height: 9px;
    border: 2px solid white;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .test-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .extras-area {
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 72px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.6;
  }

  .extras-area:focus {
    border-color: var(--accent);
  }

  .extras-area::placeholder {
    color: #b0aa9f;
  }

  .preview-box {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--text);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    white-space: pre-wrap;
    min-height: 80px;
  }

  .preview-empty {
    color: var(--muted);
    font-style: italic;
    font-family: var(--sans);
    font-size: 13px;
  }

  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-copy {
    flex: 1;
    padding: 13px 20px;
    background: var(--text);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: -0.01em;
  }

  .btn-copy:hover { background: #333; }

  .btn-copy:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .btn-copy.copied {
    background: var(--check);
  }

  .btn-reset {
    padding: 13px 16px;
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-reset:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .count-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }

  .count-badge span {
    color: var(--check);
    font-weight: 500;
  }

  footer {
    margin-top: 32px;
    font-family: var(--mono);
    font-size: 11px;
    color: #b0aa9f;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header>
  <div class="tag">NHS Primary Care</div>
  <h1>Blood Test <span>Request Tool</span></h1>
  <p class="subtitle">Select tests, copy message — no data stored.</p>
</header>

<div class="card">

  <!-- Tests -->
  <div class="card-section">
    <div class="section-label">Select tests</div>
    <div class="tests-grid" id="testsGrid"></div>
    <div class="count-badge" id="countBadge">No tests selected</div>
  </div>

  <!-- Extra tests -->
  <div class="card-section">
    <div class="section-label">Additional / custom tests</div>
    <textarea class="extras-area" id="extras" placeholder="e.g. Cortisol, B12, Ferritin…"></textarea>
  </div>

  <!-- Preview -->
  <div class="card-section">
    <div class="section-label">Message preview</div>
    <div class="preview-box" id="preview"><span class="preview-empty">Select at least one test to see the message.</span></div>
  </div>

  <!-- Actions -->
  <div class="card-section">
    <div class="actions">
      <button class="btn-copy" id="copyBtn" disabled>Copy message</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

</div>

<footer>No patient data is collected or stored.</footer>

<script>
  const TESTS = ['FBC', 'Renal', 'Liver', 'Random lipids', 'HbA1c', 'TSH', 'ACR (urine test)', 'Lithium levels', 'B12 and Folate', 'Iron studies', 'Ferritin', 'PSA', 'Clotting', 'INR'];
  const BASE_MESSAGE = `You need a routine blood test to monitor your health and the safety of your medication. Please collect a blood test form at reception. Book a blood test online: https://www.merseycare.nhs.uk/mybloodtest/ or call 0151 285 4548 (Monday to Friday, 8 am - 4 pm). Call us 2 weeks after the blood test for the results (2-4 pm) or check them on the NHS app.\n\nRequired tests:`;
  const URINE_MESSAGE = `You need a routine urine test to monitor your health and the safety of your medication. Please collect a urine test kit at reception. Call us 2 weeks after the test for the results (2-4 pm) or check them on the NHS app.\n\nRequired tests:`;

  const grid = document.getElementById('testsGrid');
  const preview = document.getElementById('preview');
  const copyBtn = document.getElementById('copyBtn');
  const resetBtn = document.getElementById('resetBtn');
  const extras = document.getElementById('extras');
  const countBadge = document.getElementById('countBadge');

  const state = {};

  // Build checkboxes
  TESTS.forEach(test => {
    state[test] = false;

    const item = document.createElement('label');
    item.className = 'test-item';
    item.innerHTML = `<input type="checkbox" data-test="${test}"><span class="test-name">${test}</span>`;

    const cb = item.querySelector('input');
    cb.addEventListener('change', () => {
      state[test] = cb.checked;
      item.classList.toggle('checked', cb.checked);
      update();
    });

    grid.appendChild(item);
  });

  extras.addEventListener('input', update);

  function getSelectedTests() {
    const selected = TESTS.filter(t => state[t]);
    const extra = extras.value.trim()
      .split('\n')
      .map(l => l.trim())
      .filter(Boolean);
    return [...selected, ...extra];
  }

  function update() {
    const selected = getSelectedTests();
    const count = selected.length;

    // Badge
    if (count === 0) {
      countBadge.innerHTML = 'No tests selected';
    } else {
      countBadge.innerHTML = `<span>${count}</span> test${count > 1 ? 's' : ''} selected`;
    }

    // Preview
    if (count === 0) {
      preview.innerHTML = '<span class="preview-empty">Select at least one test to see the message.</span>';
      copyBtn.disabled = true;
      return;
    }

    const acrOnly = selected.length === 1 && selected[0] === 'ACR (urine test)';
    const message = acrOnly ? URINE_MESSAGE : BASE_MESSAGE;
    const list = selected.map(t => `• ${t}`).join('\n');
    preview.textContent = `${message}\n${list}`;
    copyBtn.disabled = false;
  }

  copyBtn.addEventListener('click', () => {
    const selected = getSelectedTests();
    if (!selected.length) return;
    const acrOnly = selected.length === 1 && selected[0] === 'ACR (urine test)';
    const message = acrOnly ? URINE_MESSAGE : BASE_MESSAGE;
    const list = selected.map(t => `• ${t}`).join('\n');
    const text = `${message}\n${list}`;

    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '✓ Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy message';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  });

  resetBtn.addEventListener('click', () => {
    TESTS.forEach(test => {
      state[test] = false;
      const cb = grid.querySelector(`[data-test="${test}"]`);
      cb.checked = false;
      cb.closest('label').classList.remove('checked');
    });
    extras.value = '';
    update();
  });
</script>
</body>
</html>
